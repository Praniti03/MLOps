name: Testing with Pytest

on:
  push:
    branches: [ main ]
    paths:
      - 'Labs/Github_Labs/Lab1/**'
      - '.github/workflows/github_lab1_pytest_action.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'Labs/Github_Labs/Lab1/**'

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Labs/Github_Labs/Lab1
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install -r requirements.txt

      - name: Run Tests with Coverage and Generate XML Report
        run: |
          pytest test/test_pytest.py --cov=src --cov-report=term-missing --junitxml=pytest-report.xml
        continue-on-error: false

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: Labs/Github_Labs/Lab1/pytest-report.xml

      - name: Notify on Success
        if: success()
        run: echo "Tests passed successfully"

      - name: Notify on Failure
        if: failure()
        run: echo "Tests failed"